services:
  # ── Backend (Node.js / Express) ───────────────────────────────────────────
  - type: web
    name: bts-supply-chain-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Set this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this manually in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in the Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set to your frontend Render URL after deployment
    healthCheckPath: /api/health

  # ── Frontend (React / Vite ─ Static Site) ────────────────────────────────
  - type: web
    name: bts-supply-chain-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend Render URL + /api e.g. https://bts-supply-chain-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
